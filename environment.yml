name: myenv
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.10
  - conda-forge::ffmpeg
  - pip
  - pip:
      # transformers needs torch>=2.6; deepfilternet 0.5.6 imports torchaudio.backend,
      # which torchaudio 2.9 removed.
      - torch>=2.6,<2.9
      - torchaudio>=2.6,<2.9
      - numpy<2
      - deepfilternet==0.5.6
      - clearvoice  # ClearerVoice-Studio: FRCRN, MossFormer2, MossFormerGAN
      - soundfile
      - transformers
      # DNSMOS: speechmos bundles Microsoft's ONNX models but doesn't declare its deps.
      - speechmos
      - librosa
      - onnxruntime
